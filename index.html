<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>General Journal System</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
</head>

<body>

<!-- JOURNAL -->
<div class="app-wrap" id="journal-page">

  <div class="topbar">
    <div>
      <h1>General Journal</h1>
      <p>Accounting entry system</p>
    </div>

    <button class="btn btn-blue" onclick="addRow()">
      <i class="ti ti-plus"></i> Add Row
    </button>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Debit Account</th>
          <th>DR</th>
          <th>Credit Account</th>
          <th>CR</th>
          <th></th>
        </tr>
      </thead>

      <tbody id="journal-body"></tbody>

      <tfoot>
        <tr class="totals">
          <td colspan="2">Totals</td>
          <td id="total-dr">P 0.00</td>
          <td></td>
          <td id="total-cr">P 0.00</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div class="footer">
    <button class="btn" onclick="showTB()">Trial Balance</button>
    <button class="btn btn-blue" onclick="saveEntries()">Save</button>
  </div>

</div>

<!-- TRIAL BALANCE -->
<div class="app-wrap" id="tb-page" style="display:none;">

  <div class="topbar">
    <div>
      <h1>Trial Balance</h1>
      <p>Summary of accounts</p>
    </div>

    <button class="btn" onclick="showJournal()">Back</button>
  </div>

  <div id="tb-content" style="padding:15px;"></div>

</div>

<script src="script.js"></script>
</body>
</html>
